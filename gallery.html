<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Palm Leaf Wisdom</title>
  <meta name="description" content="A selection of photographs from Palm Leaf Wisdom, offering traditional palm leaf readings and related services in India and online.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header id="site-header">
    <!-- Menu is built by js/layout.js. This simple menu shows if JavaScript is off. -->
    <noscript>
      <nav aria-label="Main menu" class="container">
        <a href="index.html">Home</a> | <a href="about.html">About Us</a> | <a href="services.html">Our Services</a> |
        <a href="gallery.html">Gallery</a> | <a href="how-it-works.html">How It Works</a> | <a href="contact.html">Contact Us</a>
      </nav>
    </noscript>
  </header>

  <main id="main">

    <section class="page-hero">
      <div class="container">
        <h1>Gallery</h1>
        <p class="lead narrow">A selection of photographs from Palm Leaf Wisdom. Select a photo to see it larger.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">

        <!--
          HOW TO ADD A PHOTO
          1. Upload the photo into the "images" folder (lowercase name, no spaces).
          2. Copy one whole <li> ... </li> block below and paste it after the last one.
          3. Change the file name in src="..." and write a short description in alt="...".
          Describe what is really in the photo. Only use photos you took, or that have a licence for commercial use.
          Ask permission before showing any person's face.
        -->
        <ul class="gallery-grid">
          <li>
            <button type="button" class="gallery-item">
              <img src="images/leaf-2.jpg" alt="Palm leaf photograph" loading="lazy">
            </button>
          </li>
          <li>
            <button type="button" class="gallery-item">
              <img src="images/hero.jpg.jpg" alt="Palm leaf photograph" loading="lazy">
            </button>
          </li>
        </ul>

      </div>
    </section>

    <dialog id="lightbox" class="lightbox" aria-label="Enlarged photo">
      <button type="button" class="button button-outline lightbox-close">Close</button>
      <img id="lightbox-img" src="" alt="">
      <p id="lightbox-caption"></p>
    </dialog>

    <section class="cta-band">
      <div class="container">
        <h2>Have a question?</h2>
        <p>Get in touch and we will be happy to explain how a consultation works.</p>
        <a class="button button-light" href="contact.html">Contact us</a>
      </div>
    </section>

  </main>

  <footer id="site-footer">
    <!-- Footer is built by js/layout.js -->
    <noscript>
      <div class="container">
        <p><a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms</a></p>
      </div>
    </noscript>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
